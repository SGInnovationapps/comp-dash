<!doctype html>
<html lang="ja" data-theme="dark">
<head>

<title>アジア競技大会2026 体操競技 TO日程</title>
<style>
/* ============================================================
   大会リアルタイム時程 テンプレート
   男子=紺 / 女子=赤。新しい大会を作るときは：
   1) <title> と MEET（title/venue）を書き換える
   2) SCHEDULE_DEFAULT を差し替える（書式はコメント参照）
   3) タブ（本会場／サブ／会議／式典）とナウボードは、実際に
      データが存在するカテゴリだけを自動判定して表示する。
      サブが無い大会ならサブタブは自動的に出ない。
   4) 本会場／サブの列は、男女どちらのデータもあれば2列、
      片方しか無ければ自動的に1列表示になる。
   男子=紺 / 女子=赤（原本の日程表の配色に合わせる）
   ============================================================ */
:root{
  --bg:#10151d; --bg2:#0b1017; --panel:#182031; --panel2:#1f2a3d;
  --line:#2e3c52; --ink:#e9edf4; --ink2:#a4b1c5; --ink3:#6d7d96;
  --chalk:#f4f6fa; --chalk-ink:#0e141c;
  --live:#f0a531; --next:#4cc3d9; --done:#5b6a80;
  --men:#4f83ff; --men2:#1c3fae; --women:#ff5d5d; --women2:#c21f2f; --both:#93a1b6;
  --warn:#ff8a5c; --ok:#57c98a;
  --r:10px;
  --font-jp:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","BIZ UDPGothic","Yu Gothic UI",Meiryo,sans-serif;
  --font-num:ui-monospace,"SFMono-Regular","DIN Alternate","Roboto Mono",Menlo,Consolas,monospace;
}
html[data-theme="light"]{
  --bg:#eef1f6; --bg2:#e2e7ef; --panel:#ffffff; --panel2:#f3f6fa;
  --line:#ccd6e2; --ink:#16202e; --ink2:#4b5d75; --ink3:#7b8ca3;
  --chalk:#16202e; --chalk-ink:#f4f6fa; --done:#9aa8ba;
  --men:#2b5fd9; --women:#d92b3c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-jp);font-size:15px;line-height:1.6;
  -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.stickytop{position:sticky;top:0;z-index:30}
.topbar{background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--line);padding:10px 14px 8px}
.tb-row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.eyebrow{font-size:10.5px;letter-spacing:.18em;color:var(--ink3)}
.clock{font-family:var(--font-num);font-variant-numeric:tabular-nums;
  font-size:clamp(30px,9vw,46px);font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--chalk)}
.clock .sec{font-size:.5em;color:var(--ink3);margin-left:2px}
.datebox{font-size:13px;color:var(--ink2);line-height:1.35}
.datebox b{color:var(--ink);font-weight:600}
.tb-spacer{flex:1 1 auto}
.dcount{text-align:right;font-size:12px;color:var(--ink2)}
.dcount .big{font-family:var(--font-num);font-size:22px;color:var(--live);font-weight:600}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink2);

.iconbtn:hover{color:var(--ink);border-color:var(--ink3)}
main{max-width:1100px;margin:0 auto;padding:14px 12px 90px}
.view{display:none}.view.on{display:block}

.note{font-size:12px;color:var(--ink3)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;

.b-men{color:var(--men)} .b-women{color:var(--women)} .b-both{color:var(--both)}
.b-live{color:var(--live);background:rgba(240,165,49,.12)}
.b-check{color:var(--warn)}
.warnbar{font-size:12.5px;color:#3a2410;background:var(--warn);border-radius:8px;padding:8px 11px;margin-bottom:12px}

/* ---------- 署名要素：ナウボード ---------- */
.board{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:14px}
.bcell{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);

.bcell.live{border-color:var(--live)}
.bcell .lbl{font-size:10px;letter-spacing:.2em;color:var(--ink3);display:flex;justify-content:space-between}
.bcell .lbl .st{color:var(--live);font-weight:700}
.bcell .ttl{font-size:15.5px;font-weight:700;margin:4px 0 1px;line-height:1.35}
.bcell .sub{font-size:12px;color:var(--ink2)}
.bcell .cd{font-family:var(--font-num);font-size:13px;color:var(--live)}
.bcell.idle .ttl{color:var(--ink3);font-weight:600;font-size:13.5px}

.chip{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--chalk);color:var(--chalk-ink);border-color:var(--chalk);font-weight:700}
.chip small{display:block;font-size:10px;opacity:.7}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);margin-left:5px;vertical-align:middle}

.rail{position:relative;padding-left:78px}
.rail:before{content:"";position:absolute;left:70px;top:4px;bottom:4px;width:1px;background:var(--line)}
.ev{position:relative;margin-bottom:8px;background:var(--panel);border:1px solid var(--line);

.ev.men{border-left-color:var(--men)} .ev.women{border-left-color:var(--women)} .ev.both{border-left-color:var(--both)}

.ev .t small{display:block;font-size:11px;color:var(--ink3)}
.ev:after{content:"";position:absolute;left:-11px;top:16px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:2px solid var(--line)}
.ev.done{opacity:.42}
.ev.done:after{background:var(--done);border-color:var(--done)}
.ev.live{border-color:var(--live);border-left-color:var(--live);

.ev.live:after{background:var(--live);border-color:var(--live)}
.ev.next:after{background:var(--next);border-color:var(--next)}
.ev.chk{border-style:dashed;border-left-style:solid}
.ev h3{font-size:15px;margin-bottom:2px}
.ev .meta{font-size:11.5px;color:var(--ink2);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.nowline{position:relative;height:0;margin:14px 0}
.nowline:before{content:"";position:absolute;left:-78px;right:0;top:0;height:2px;

/* ---------- 男女2列表示（本会場／サブ） ---------- */
.common-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col-head{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;

.col-head .dot{width:8px;height:8px;border-radius:50%;background:var(--both)}
.col-head.men .dot{background:var(--men)} .col-head.women .dot{background:var(--women)}
.colrail{display:flex;flex-direction:column;gap:6px}
.cev{background:var(--panel);border:1px solid var(--line);border-left-width:3px;
  border-radius:8px;padding:7px 9px}
.cev.men{border-left-color:var(--men)} .cev.women{border-left-color:var(--women)}
.cev.done{opacity:.42}
.cev.live{border-color:var(--live);border-left-color:var(--live);box-shadow:0 0 0 1px var(--live) inset}
.cev.next{box-shadow:0 0 0 1px var(--next) inset}
.cev.chk{border-style:dashed;border-left-style:solid}

.cev h4{font-size:12.5px;margin:2px 0 0;font-weight:700;line-height:1.3}
.cev .cmeta{font-size:10px;color:var(--ink2);margin-top:3px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.colnow{font-size:10.5px;color:var(--live);font-weight:700;text-align:center;
  padding:2px 0;border-top:1px dashed var(--live);border-bottom:1px dashed var(--live);margin:2px 0}
@media (max-width:400px){
  .cols{gap:6px}
  .cev{padding:6px 7px}
  .cev h4{font-size:11.5px}
}

@media (max-width:640px){
  main{padding:12px 10px 90px}
  .rail{padding-left:62px}.rail:before{left:54px}
  .ev .t{left:-62px;width:48px;font-size:12.5px}
  .nowline:before,.nowline span{left:-62px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.stickytop,.noprint{display:none!important}main{padding:0}.ev{break-inside:avoid}@page{size:A4;margin:12mm}}
</style>

/* ============ 時刻 ============ */
let fakeOffset=0;
const now=()=>new Date(Date.now()+fakeOffset);
const WD=["日","月","火","水","木","金","土"];
const p2=n=>String(n).padStart(2,'0');
const ymd=dt=>`${dt.getFullYear()}-${p2(dt.getMonth()+1)}-${p2(dt.getDate())}`;
function evDate(day,hm){const[y,m,d]=day.split('-').map(Number);const[h,mi]=(hm||'00:00').split(':').map(Number);
  return new Date(y,m-1,d,h||0,mi||0,0,0);}
function fmtCd(ms){const s=Math.max(0,Math.round(ms/1000));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return h?`${h}:${p2(m)}:${p2(ss)}`:`${m}:${p2(ss)}`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function tickClock(){
  const t=now();
  $('#clock').innerHTML=`${p2(t.getHours())}:${p2(t.getMinutes())}<span class="sec">${p2(t.getSeconds())}</span>`;
  $('#eyebrow').textContent=MEET.title;
  document.title=MEET.title+'｜時程';
  $('#datebox').innerHTML=`<b>${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日（${WD[t.getDay()]}）</b><br>
    <span class="note">${fakeOffset?'※仮の日時で表示中':(MEET.venue||'')}</span>`;
  const all=flat();
  const first=all.length?all[0].st:null,last=all.length?all[all.length-1].et:null;
  if(first&&t<first){$('#dcount').innerHTML=`開幕まで<br><span class="big">${Math.ceil((first-t)/86400000)}</span> 日`;}
  else if(last&&t<=last){$('#dcount').innerHTML='<span class="big">大会中</span>';}
  else{$('#dcount').innerHTML='';}
}

/* ============ ビュー ============ */
let selDay=null;
function flat(){const a=[];SCHEDULE.forEach(d=>d.items.forEach(it=>a.push({...it,day:d.d,
  st:evDate(d.d,it.s),et:evDate(d.d,it.e||it.s)})));return a.sort((x,y)=>x.st-y.st);}
function statusOf(it,t){
  if(!it.e||it.e===it.s)return t>=it.st?(t-it.st<40*60000?'live':'done'):'wait';
  if(t>=it.et)return'done';if(t>=it.st)return'live';return'wait';}
const gcls=g=>g==='男子'?'men':g==='女子'?'women':'both';
const gbadge=g=>g==='男子'?'b-men':g==='女子'?'b-women':'b-both';

/* --- データに実在するカテゴリ／区分だけを自動検出 ---
   サブが無い大会は c:"サブ" の行が0件になるので、サブタブ・サブのナウボードは自動的に出ない。
   本会場やサブが男女どちらか一方のデータしか無ければ、その区分は自動で1列表示になる。 */
const CATS_PRESENT=[...new Set(SCHEDULE.flatMap(d=>d.items).map(i=>i.c))];
function gendersIn(cat){
  return [...new Set(SCHEDULE.flatMap(d=>d.items).filter(i=>i.c===cat&&i.g!=='共通').map(i=>i.g))];
}

/* --- ナウボード：本会場／サブは男女データが揃っていれば分割、無ければ単一。今やっていること＋次 --- */
const BOARD_CELLS=['本会場','サブ'].filter(c=>CATS_PRESENT.includes(c)).flatMap(c=>{
  const gs=gendersIn(c);
  if(gs.length>=2)return[{key:c+'-男子',label:c+'・男子',c,g:'男子'},{key:c+'-女子',label:c+'・女子',c,g:'女子'}];
  return[{key:c,label:c,c,g:null}];
});
function renderBoard(){
  const t=now(),all=flat(),box=$('#board');box.innerHTML='';
  BOARD_CELLS.forEach(({label,c,g})=>{
    const inCell=i=>i.c===c&&(!g||i.g===g);
    const lives=all.filter(i=>inCell(i)&&statusOf(i,t)==='live'&&i.e&&i.e!==i.s);
    const next=all.find(i=>inCell(i)&&i.st>t);
    const gtag=i=>g?'':`<span class="badge ${gbadge(i.g)}">${i.g}</span> `;
    const cell=document.createElement('div');
    if(lives.length){
      cell.className='bcell live';
      cell.innerHTML=`<div class="lbl"><span>${label}</span><span class="st">NOW</span></div>`+
        lives.map(i=>`<div class="ttl">${gtag(i)}${esc(i.t)}
          <span class="sub num">${i.s}–${i.e}（残り <span class="cd">${fmtCd(i.et-t)}</span>）</span></div>`).join('')+
        (next?`<div class="sub" style="margin-top:4px">次 ${next.s} ${gtag(next)}${esc(next.t)}</div>`:'');
    }else if(next){
      cell.className='bcell';
      const dd=next.st-t,dys=Math.floor(dd/86400000);
      cell.innerHTML=`<div class="lbl"><span>${label}</span><span>NEXT</span></div>
        <div class="ttl">${gtag(next)}${esc(next.t)}</div>
        <div class="sub num">${next.day.slice(5).replace('-','/')} ${next.s} 開始（あと ${dys>0?dys+'日 ':''}${fmtCd(dd%86400000)}）</div>`;
    }else{
      cell.className='bcell idle';
      cell.innerHTML=`<div class="lbl"><span>${label}</span></div><div class="ttl">予定はすべて終了しました</div>`;
    }
    box.appendChild(cell);});
  /* 会議・式典は直近があるときだけ出す */
  ["会議","式典"].forEach(cat=>{
    const lives=all.filter(i=>i.c===cat&&statusOf(i,t)==='live');
    const next=all.find(i=>i.c===cat&&i.st>t&&i.st-t<24*3600000);
    if(!lives.length&&!next)return;
    const cell=document.createElement('div');
    const i=lives[0]||next;
    cell.className='bcell'+(lives.length?' live':'');
    cell.innerHTML=`<div class="lbl"><span>${cat}</span><span class="${lives.length?'st':''}">${lives.length?'NOW':'NEXT'}</span></div>
      <div class="ttl">${esc(i.t)}</div>
      <div class="sub num">${i.day.slice(5).replace('-','/')} ${i.s}${i.e&&i.e!==i.s?'–'+i.e:''}
      ${!lives.length?`（あと ${fmtCd(i.st-t)}）`:''}</div>`;
    box.appendChild(cell);});
}

/* --- タブ：実データがあるカテゴリだけ、本会場→サブ→会議→式典の順で出す --- */
const FILTERS=['本会場','サブ','会議','式典'].filter(c=>CATS_PRESENT.includes(c)).map(key=>({key,label:key}));
let selCat=store.get('cat',null);
if(!FILTERS.some(f=>f.key===selCat))selCat=(FILTERS[0]||{key:'本会場'}).key;
function renderFilters(){
  const box=$('#filters');box.innerHTML='';
  FILTERS.forEach(({key,label})=>{
    const b=document.createElement('button');b.className='fchip';
    b.setAttribute('aria-pressed',String(key===selCat));b.textContent=label;
    b.onclick=()=>{selCat=key;store.set('cat',key);renderFilters();renderRail();};
    box.appendChild(b);});
}
function renderDays(){
  const box=$('#daychips');box.innerHTML='';const t=now();
  SCHEDULE.forEach(d=>{
    const[y,m,dd]=d.d.split('-').map(Number),dt=new Date(y,m-1,dd);
    const b=document.createElement('button');b.className='chip';
    b.setAttribute('aria-pressed',String(d.d===selDay));
    b.innerHTML=`${m}/${dd}${ymd(t)===d.d?'<span class="dot"></span>':''}<small>${WD[dt.getDay()]}曜</small>`;
    b.onclick=()=>{selDay=d.d;renderDays();renderRail();};
    box.appendChild(b);});
}

/* --- 本会場／サブ：男女2列表示 --- */
function renderColEvents(container,items,t){
  container.innerHTML='';
  if(!items.length){container.innerHTML='<p class="note" style="font-size:11.5px">予定なし</p>';return;}
  let lineDone=false;
  const firstWait=items.findIndex(i=>statusOf(i,t)==='wait');
  items.forEach((it,idx)=>{
    const st=statusOf(it,t);
    if(!lineDone&&st==='wait'&&ymd(t)===selDay){
      const nl=document.createElement('div');nl.className='colnow';
      nl.textContent=`${p2(t.getHours())}:${p2(t.getMinutes())} 現在`;container.appendChild(nl);lineDone=true;}
    const cls=st==='done'?'done':st==='live'?'live':(idx===firstWait?'next':'');
    const el=document.createElement('div');
    el.className=`cev ${gcls(it.g)} ${cls}${it.k?' chk':''}`;
    el.innerHTML=`
      <div class="ct num">${it.s}${it.e&&it.e!==it.s?'–'+it.e:''}</div>
      <h4>${esc(it.t)}</h4>
      <div class="cmeta">
        ${it.k?'<span class="badge b-check">要確認</span>':''}
        ${st==='live'?'<span class="badge b-live">進行中</span>':''}
        ${st==='live'&&it.e&&it.e!==it.s?`<span class="num cdrem" style="color:var(--live)">残り ${fmtCd(it.et-t)}</span>`:''}
      </div>`;
    container.appendChild(el);});
}
function renderTwoCol(container,items,t){
  const common=items.filter(i=>i.g==='共通');
  const men=items.filter(i=>i.g==='男子');
  const women=items.filter(i=>i.g==='女子');
  if(common.length){
    const bar=document.createElement('div');bar.className='common-bar';
    common.forEach(it=>{
      const chip=document.createElement('div');
      chip.className='common-chip'+(statusOf(it,t)==='live'?' live':'');
      chip.innerHTML=`<span class="num">${it.s}</span><span>${esc(it.t)}</span>`;
      bar.appendChild(chip);});
    container.appendChild(bar);
  }
  const cols=document.createElement('div');cols.className='cols';
  const mCol=document.createElement('div');
  mCol.innerHTML='<div class="col-head men"><span class="dot"></span>男子</div>';
  const mList=document.createElement('div');mList.className='colrail';mCol.appendChild(mList);
  const wCol=document.createElement('div');
  wCol.innerHTML='<div class="col-head women"><span class="dot"></span>女子</div>';
  const wList=document.createElement('div');wList.className='colrail';wCol.appendChild(wList);
  cols.appendChild(mCol);cols.appendChild(wCol);
  container.appendChild(cols);
  renderColEvents(mList,men,t);
  renderColEvents(wList,women,t);
}

/* --- 会議／式典：単一列表示 --- */
function renderSingleCol(container,items,t){
  const wrap=document.createElement('div');wrap.className='rail';
  let lineDone=false;
  const firstWait=items.findIndex(i=>statusOf(i,t)==='wait');
  items.forEach((it,idx)=>{
    const st=statusOf(it,t);
    if(!lineDone&&st==='wait'&&ymd(t)===selDay){
      const nl=document.createElement('div');nl.className='nowline';
      nl.innerHTML=`<span>${p2(t.getHours())}:${p2(t.getMinutes())} 現在</span>`;wrap.appendChild(nl);lineDone=true;}
    const cls=st==='done'?'done':st==='live'?'live':(idx===firstWait?'next':'');
    const el=document.createElement('div');
    el.className=`ev ${gcls(it.g)} ${cls}${it.k?' chk':''}`;
    el.innerHTML=`
      <div class="t num">${it.s}<small>${it.e&&it.e!==it.s?'▼ '+it.e:''}</small></div>
      <h3>${esc(it.t)}</h3>
      <div class="meta">
        <span class="badge ${gbadge(it.g)}">${it.g}</span>
        ${it.k?'<span class="badge b-check">時刻 要確認</span>':''}
        ${st==='live'?'<span class="badge b-live">進行中</span>':''}
        ${st==='live'&&it.e&&it.e!==it.s?`<span class="num cdrem" style="color:var(--live)">残り ${fmtCd(it.et-t)}</span>`:''}
        ${it.m?`<span>${esc(it.m)}</span>`:''}
      </div>`;
    wrap.appendChild(el);});
  container.appendChild(wrap);
}

function renderRail(){
  const t=now(),rail=$('#rail');rail.innerHTML='';
  const items=flat().filter(i=>i.day===selDay&&i.c===selCat);
  if(!items.length){
    rail.innerHTML=`<p class="note">${selCat==='会議'?'会議の予定は未登録です。':'この日の項目はありません。'}</p>`;return;}
  const isVenue=(selCat==='本会場'||selCat==='サブ');
  if(isVenue&&gendersIn(selCat).length>=2){renderTwoCol(rail,items,t);}
  else{renderSingleCol(rail,items,t);}
}
function checkWarn(){
  const n=flat().filter(i=>i.k).length;
  $('#checkWarn').innerHTML=n?`<div class="warnbar">時刻が未確定の項目が ${n} 件あります（点線の枠）。</div>`:'';
}

/* ============ 画面 ============ */
$('#themeBtn').onclick=()=>{const d=document.documentElement;
  const v=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=v;
  try{localStorage.setItem(NS+':theme',JSON.stringify(v));}catch(e){}};
document.documentElement.dataset.theme=store.get('theme','dark');

function init(){
  const t=now(),td=ymd(t);
  selDay=SCHEDULE.some(d=>d.d===td)?td:(SCHEDULE.find(d=>d.d>=td)||SCHEDULE[SCHEDULE.length-1]).d;
  checkWarn();renderBoard();renderFilters();renderDays();renderRail();tickClock();}
setInterval(()=>{tickClock();renderBoard();
  const t=now();
  $$('#rail .cdrem').length&&renderRail();},1000);
init();
</script>
</body>
</html>
